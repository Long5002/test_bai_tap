version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: web_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    restart: always

  nodered:
    image: nodered/node-red:latest
    container_name: web_nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    restart: always

  mariadb:
    image: mariadb:latest
    container_name: web_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: web_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web_cloudflared
    restart: always

volumes:
  nodered_data:
  mariadb_data:
